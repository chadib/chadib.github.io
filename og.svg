<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Octopult — Du problème au système</title>
  <desc id="desc">Carte sociale sombre avec la nouvelle identité Octopult et huit flux orchestrés.</desc>
