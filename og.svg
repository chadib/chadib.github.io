  <text x="84" y="205" fill="#8174FF" font-family="JetBrains Mono, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="2.2">STUDIO DE SYSTÈMES INTELLIGENTS</text>
  <text x="82" y="286" fill="#F5F7FA" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="57" font-weight="700" letter-spacing="-3.3">
    <tspan x="82" dy="0">Dites le problème.</tspan>
    <tspan x="82" dy="66" fill="#BEB6FF">Nous construisons</tspan>
    <tspan x="82" dy="66" fill="#6FCBFF">le système.</tspan>
  </text>
  <text x="84" y="548" fill="#A7AFBF" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17">FRICTION  →  DIRECTION  →  SYSTÈME</text>

