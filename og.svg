  <text x="84" y="502" fill="#A7AFBF" font-family="Arial, Helvetica, sans-serif" font-size="20">Vous apportez le problème. Octopult cherche le chemin.</text>
  <text x="84" y="540" fill="#F5F7FA" font-family="Arial, Helvetica, sans-serif" font-size="20">Chadi construit ce qui doit réellement fonctionner.</text>

