  <text x="84" y="490" fill="#A7AFBF" font-family="Arial, Helvetica, sans-serif" font-size="19">Vous apportez le problème. Octopult fait émerger le système.</text>
  <text x="84" y="528" fill="#F5F7FA" font-family="Arial, Helvetica, sans-serif" font-size="19">Chadi construit ce qui doit réellement fonctionner.</text>

